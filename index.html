<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire - Prototype</title>
<style>
html,body{
    margin:0;
    height:100%;
    font-family:Georgia,serif;
    overflow:hidden;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#13233f,#0b1020,#000);
    color:white;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 35%),
      radial-gradient(circle at 80% 70%,rgba(255,215,120,.08),transparent 30%);
    animation: drift 18s linear infinite alternate;
}
@keyframes drift{
    from{transform:scale(1) translateY(0);}
    to{transform:scale(1.08) translateY(-20px);}
}
.menu{
    position:relative;
    z-index:1;
    text-align:center;
}
h1{
    font-size:72px;
    margin:0 0 12px;
    letter-spacing:8px;
}
.subtitle{
    color:#d8c38b;
    margin-bottom:50px;
    font-style:italic;
}
button{
    display:block;
    width:320px;
    margin:18px auto;
    padding:18px;
    font-size:24px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
    transition:.2s;
}
button:hover{
    transform:scale(1.03);
    background:rgba(255,255,255,.18);
}
#status{
    margin-top:30px;
    color:#d8c38b;
    min-height:24px;
}
</style>
</head>
<body>
<div class="menu">
<h1>EMPIRE</h1>
<div class="subtitle">Prototype v0.1</div>

<button onclick="msg('Single Player is not implemented yet.')">Single Player</button>
<button onclick="msg('No saved games found.')">Continue</button>
<button onclick="msg('Settings will be available in the next version.')">Settings</button>

<div id="status"></div>
</div>

<script>
function msg(text){
 document.getElementById('status').textContent=text;
}
</script>
</body>
</html>
