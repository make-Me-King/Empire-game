<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire - Prototype v0.2</title>
<style>
:root{--bg1:#13233f;--bg2:#0b1020;--gold:#d8c38b;--panel:rgba(8,14,28,.92);--line:rgba(255,255,255,.18);--button:rgba(255,255,255,.08);--button-hover:rgba(255,255,255,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:linear-gradient(180deg,var(--bg1),var(--bg2),#000);color:#fff}body{min-height:100vh;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 35%),radial-gradient(circle at 80% 70%,rgba(255,215,120,.08),transparent 30%)}
.screen{position:relative;z-index:1;min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}.screen.active{display:flex}.menu,.setup{width:min(92vw,520px);text-align:center}h1{font-size:clamp(48px,12vw,76px);letter-spacing:8px;margin:0 0 12px}.subtitle{color:var(--gold);margin-bottom:42px;font-style:italic}.main-btn,.value-btn,.action-btn,.option-btn{width:100%;border:1px solid var(--line);background:var(--button);color:#fff;border-radius:12px;cursor:pointer;transition:.2s}.main-btn{margin:12px 0;padding:18px;font-size:24px}.main-btn:hover,.value-btn:hover,.action-btn:hover,.option-btn:hover{background:var(--button-hover);transform:scale(1.01)}.setup h2{font-size:38px;margin:0 0 8px}.setup-subtitle{color:var(--gold);margin-bottom:28px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}.setting-label{font-size:19px}.value-btn{width:190px;padding:14px 16px;font-size:18px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}.action-btn{padding:16px;font-size:19px}.primary{border-color:rgba(216,195,139,.6);color:#fff5d2}.status{color:var(--gold);margin-top:22px;min-height:26px}.modal-backdrop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.72)}.modal-backdrop.open{display:flex}.modal{width:min(92vw,420px);background:var(--panel);border:1px solid rgba(216,195,139,.45);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.55)}.modal h3{margin:0 0 18px;text-align:center;font-size:27px}.option-btn{margin:9px 0;padding:15px;font-size:18px}.close-btn{margin-top:12px}@media(max-width:520px){.setting-row{flex-direction:column;align-items:stretch}.setting-label{text-align:center}.value-btn{width:100%}}
</style>
</head>
<body>
<section id="mainMenu" class="screen active" aria-label="Main menu">
  <div class="menu">
    <h1>EMPIRE</h1>
    <div class="subtitle">Prototype v0.2</div>
    <button class="main-btn" onclick="showSetup()">Single Player</button>
    <button class="main-btn" onclick="showMessage('No saved games found.')">Continue</button>
    <button class="main-btn" onclick="showMessage('Settings will be available in a future version.')">Settings</button>
    <div id="mainStatus" class="status" aria-live="polite"></div>
  </div>
</section>
<section id="gameSetup" class="screen" aria-label="Game setup">
  <div class="setup">
    <h2>GAME SETUP</h2>
    <div class="setup-subtitle">Shape your world</div>
    <div class="setting-row"><div class="setting-label">Map Size</div><button id="mapSizeValue" class="value-btn" onclick="openPicker('mapSize')">Medium</button></div>
    <div class="setting-row"><div class="setting-label">Civilizations</div><button id="civilizationsValue" class="value-btn" onclick="openPicker('civilizations')">4</button></div>
    <div class="setting-row"><div class="setting-label">Difficulty</div><button id="difficultyValue" class="value-btn" onclick="openPicker('difficulty')">Normal</button></div>
    <div class="setting-row"><div class="setting-label">Game Speed</div><button id="gameSpeedValue" class="value-btn" onclick="openPicker('gameSpeed')">Standard</button></div>
    <div class="actions"><button class="action-btn" onclick="showMain()">Back</button><button class="action-btn primary" onclick="startGame()">Start Game</button></div>
    <div id="setupStatus" class="status" aria-live="polite"></div>
  </div>
</section>
<div id="modalBackdrop" class="modal-backdrop" role="presentation" onclick="backdropClose(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Choose Option</h3>
    <div id="modalOptions"></div>
    <button class="option-btn close-btn" onclick="closePicker()">Close</button>
  </div>
</div>
<script>
const options={mapSize:{title:'Choose Map Size',values:['Small','Medium','Large','Huge']},civilizations:{title:'Choose Civilizations',values:['2','3','4','5','6','7','8']},difficulty:{title:'Choose Difficulty',values:['Easy','Normal','Hard']},gameSpeed:{title:'Choose Game Speed',values:['Quick','Standard','Epic']}};
function showSetup(){document.getElementById('mainMenu').classList.remove('active');document.getElementById('gameSetup').classList.add('active');document.getElementById('setupStatus').textContent='';document.getElementById('mapSizeValue').focus()}
function showMain(){document.getElementById('gameSetup').classList.remove('active');document.getElementById('mainMenu').classList.add('active');document.querySelector('#mainMenu .main-btn').focus()}
function showMessage(text){document.getElementById('mainStatus').textContent=text}
function openPicker(type){const config=options[type];document.getElementById('modalTitle').textContent=config.title;const container=document.getElementById('modalOptions');container.innerHTML='';config.values.forEach(value=>{const button=document.createElement('button');button.className='option-btn';button.textContent=value;button.onclick=()=>selectOption(type,value);container.appendChild(button)});document.getElementById('modalBackdrop').classList.add('open');setTimeout(()=>container.querySelector('button')?.focus(),0)}
function selectOption(type,value){document.getElementById(type+'Value').textContent=value;closePicker();document.getElementById(type+'Value').focus()}
function closePicker(){document.getElementById('modalBackdrop').classList.remove('open')}
function backdropClose(event){if(event.target.id==='modalBackdrop')closePicker()}
function startGame(){const map=document.getElementById('mapSizeValue').textContent;const civs=document.getElementById('civilizationsValue').textContent;const difficulty=document.getElementById('difficultyValue').textContent;const speed=document.getElementById('gameSpeedValue').textContent;document.getElementById('setupStatus').textContent=`Creating world: ${map} map, ${civs} civilizations, ${difficulty} difficulty, ${speed} speed.`}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('modalBackdrop').classList.contains('open'))closePicker();else if(document.getElementById('gameSetup').classList.contains('active'))showMain()}})
</script>
</body>
</html>
